---
layout: default
---
<article class="page-container container">
  <header class="page-header">
    <h1 class="page-title">{{ page.title | escape }}</h1>
    {% if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle | escape }}</p>
    {% endif %}
  </header>

  <div class="page-content prose">
    {{ content }}
  </div>
</article>
