<header class="site-header">
  <div class="header-inner container">
    <a href="{{ site.baseurl }}/" class="brand-logo" aria-label="Omnichannel Group Blog Home">
      <div class="brand-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Omnichannel Group</span>
        <span class="brand-sub">ProCompare Tech</span>
      </div>
    </a>

    <nav class="site-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        <li><a href="{{ site.baseurl }}/#articles" class="nav-link">Articles</a></li>
        <li><a href="{{ site.baseurl }}/#matrix" class="nav-link">Comparison Matrix</a></li>
        <li><a href="{{ site.baseurl }}/about/" class="nav-link">About &amp; Research</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <!-- Search Input Trigger -->
      <form class="header-search-wrap" action="{{ site.baseurl }}/" method="get" role="search">
        <input type="search" id="site-search-input" name="q" placeholder="Search articles..." aria-label="Search articles" autocomplete="off">
        <kbd class="search-kbd">/</kbd>
      </form>

      <!-- Theme Switcher -->
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light or dark theme" title="Toggle theme">
        <span class="theme-icon-light" aria-hidden="true">
          <!-- Sun Icon -->
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
        <span class="theme-icon-dark" aria-hidden="true">
          <!-- Moon Icon -->
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
      </button>

    </div>
  </div>
</header>
